<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethical Visualization: White Hat vs Black Hat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Merriweather:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <header class="page-header">
        <h1>Title</h1>
        <p>description</p>
    </header>

    <main>
        <!-- White Hat Section -->
        <section class="viz-section white-hat-section">
            <div class="section-header">
                <h2>White Hat: The Illusion of Parity</h2>
                <div class="controls">
                    <label for="white-country"><strong>Region: </strong></label>
                    <select id="white-country" class="ui-select"></select>
                    
                    <label for="white-slider" style="margin-left: 20px;"><strong>Year: </strong><span id="white-year-label">2018</span></label>
                    <input type="range" id="white-slider" min="2010" max="2018" value="2018" step="1">

                    <!-- NEW: Reset Zoom Button -->
                    <button id="reset-zoom-btn" class="ui-button" style="margin-left: 20px;">Reset Zoom</button>
                </div>
            </div>

            <div class="dual-chart-layout">
                <div id="white-edu-viz" class="chart-container half-chart"></div>
                <div id="white-emp-viz" class="chart-container half-chart"></div>
            </div>
            
            <div class="writeup">
                <h3>Design Rationale & Transparency</h3>
                <p><strong>Dataset & Transformations:</strong> </p>
                <p><strong>Interactive & Honest Design:</strong> </p>
            </div>
        </section>

        <hr class="divider">

        <!-- Black Hat Section -->
        <section class="viz-section black-hat-section">
            <div class="section-header">
                <h2>Black Hat: THE GENDER WORKFORCE DIVIDE</h2>
                <div class="controls black-controls">
                    <label for="black-slider"><strong>Analyze Market: </strong><span id="black-year-label">2018</span></label>
                    <input type="range" id="black-slider" min="2010" max="2018" value="2018" step="1">
                </div>
            </div>

            <div id="black-hat-viz" class="chart-container"></div>
            
            <div class="writeup">
                <h3>Manipulative Techniques Used</h3>
                <p><strong>Violating the Baseline & Misleading Axes:</strong> </p>
                <p><strong>Deceptive Interactivity & Encodings:</strong> </p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
